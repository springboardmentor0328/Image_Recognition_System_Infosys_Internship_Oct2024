<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            background-image: url("wall.jpg");

        h1 {
            color: #0078d7;
        }

    <h1>Follow the Instructions</h1>
    <div>
        <img src="{{ url_for('video_feed') }}" alt="Video Feed">
