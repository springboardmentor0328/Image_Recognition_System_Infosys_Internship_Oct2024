<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .btn {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }
        .btn:hover {
            background-color: #218838;
        }
        .input-field {
            font-size: 18px;
            padding: 10px;
            margin: 10px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Face Recognition and Capture</h1>
    <input type="text" id="person_name" class="input-field" placeholder="Enter Name">
    <button class="btn" id="start_capture">Start Capturing</button>
    <button class="btn" id="start_recognition">Start Recognition</button>

    <div id="status" style="margin-top: 20px;"></div>

    <script>
        document.getElementById('start_capture').addEventListener('click', function() {
            const personName = document.getElementById('person_name').value;
            if (!personName) {
                document.getElementById('status').innerText = 'Please enter a name before capturing.';
                return;
            }

            fetch('/start_capture', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: personName })
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status').innerText = data.status;
                })
                .catch(error => {
                    document.getElementById('status').innerText = 'Error: ' + error;
                });
        });

        document.getElementById('start_recognition').addEventListener('click', function() {
    console.log('Recognition started');  // Debugging line
    fetch('/start_recognition')
        .then(response => response.json())
        .then(data => {
            document.getElementById('status').innerText = data.status;
        })
        .catch(error => {
            document.getElementById('status').innerText = 'Error: ' + error;
        });
});

    </script>
</body>
</html>
